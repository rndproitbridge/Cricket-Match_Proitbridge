<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PIB vs ZPX Live Cricket</title>

     config.js sets window.GOOGLE_CLIENT_ID and window.DRIVE_FOLDER_NAME. -->
<script src="config.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
html,body{margin:0;-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: team-colour scoreboard (PIB navy & sky, ZPX red & black) — one big score panel, then tabs for scorecard, awards and the scorer's keypad */
:root{
  --bg:#F3F6FB; --panel:#FFFFFF; --ink:#0B1633; --muted:#5B6782; --line:#D7DFEC;
  --turf:#0A1F5B; --turf-ink:#FFFFFF; --lamp:#E2263A; --lamp-ink:#FFFFFF; --sky:#00AEEF; --sky-ink:#04122E;
  --board:linear-gradient(135deg,#0A1F5B 0%,#081436 55%,#05070D 100%);
  --pib:#0A1F5B; --zpx:#D61F33; --good:#1E7A44; --bad:#C81E30; --chip:#E8EEF7;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#060A14; --panel:#0D1428; --ink:#E9EEF8; --muted:#9AA6C0; --line:#1E2A47;
  --turf:#1A3A8F; --turf-ink:#FFFFFF; --lamp:#FF3B4E; --lamp-ink:#FFFFFF; --sky:#22BFF5; --sky-ink:#04122E;
  --board:linear-gradient(135deg,#0D2A78 0%,#0A1638 55%,#030509 100%);
  --pib:#5CC8F5; --zpx:#FF6B78; --good:#5CC98A; --bad:#FF7A85; --chip:#16203A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#060A14; --panel:#0D1428; --ink:#E9EEF8; --muted:#9AA6C0; --line:#1E2A47;
  --turf:#1A3A8F; --turf-ink:#FFFFFF; --lamp:#FF3B4E; --lamp-ink:#FFFFFF; --sky:#22BFF5; --sky-ink:#04122E;
  --board:linear-gradient(135deg,#0D2A78 0%,#0A1638 55%,#030509 100%);
  --pib:#5CC8F5; --zpx:#FF6B78; --good:#5CC98A; --bad:#FF7A85; --chip:#16203A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:980px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);letter-spacing:.02em;margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.top h1{font-size:26px;text-transform:uppercase}
.sub{color:var(--muted);font-size:13px}
.board{background:var(--board);color:var(--turf-ink);border-radius:14px;padding:18px 20px;display:grid;gap:14px}
.board .row{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px}
.team{font-family:var(--display);font-size:20px;text-transform:uppercase;letter-spacing:.06em;opacity:.9}
.score{font-family:var(--display);font-weight:700;font-size:64px;line-height:.95}
.score small{font-size:28px;font-weight:600;opacity:.85;margin-left:8px}
.meta{display:flex;gap:18px;flex-wrap:wrap;font-size:14px}
.meta b{font-family:var(--display);font-size:20px;display:block;line-height:1}
.meta span{opacity:.8;font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.ball{min-width:34px;height:34px;padding:0 6px;border-radius:17px;display:inline-grid;place-items:center;font-family:var(--display);font-weight:600;font-size:16px;background:rgba(255,255,255,.14);color:inherit}
.ball.b4{background:var(--sky);color:var(--sky-ink)}.ball.b6{background:var(--lamp);color:var(--lamp-ink)}.ball.bw{background:#FFFFFF;color:#E2263A;box-shadow:inset 0 0 0 2px #E2263A}.ball.bx{background:rgba(255,255,255,.28)}
.banner{background:var(--lamp);color:var(--lamp-ink);border-radius:10px;padding:8px 12px;font-weight:700;font-family:var(--display);font-size:18px;letter-spacing:.03em}
.crease{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.crease div{background:rgba(0,0,0,.18);border-radius:10px;padding:10px 12px;min-width:0}
.crease .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.1em;opacity:.75}
.crease .nm{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tabs a{padding:8px 14px;text-decoration:none;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;font-family:var(--display);font-size:18px;text-transform:uppercase;letter-spacing:.05em}
.tabs a.on{color:var(--ink);border-color:var(--lamp)}
.tabs a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:10px;min-width:0}
.card h2{font-size:20px;text-transform:uppercase}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
td.how{color:var(--muted);font-size:12px;text-align:left;white-space:normal}
tr.live td:first-child{font-weight:700}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.muted{color:var(--muted)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
button{font-family:var(--body);font-size:15px;font-weight:600;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:10px 14px;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--turf);color:var(--turf-ink);border-color:var(--turf)}
button.lamp{background:var(--lamp);color:var(--lamp-ink);border-color:var(--lamp)}
button.danger{color:var(--bad);border-color:var(--bad)}
button.tog.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pad{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.pad button{font-family:var(--display);font-size:28px;padding:14px 0}
.pad button.r4{background:var(--sky);color:var(--sky-ink);border-color:var(--sky)}.pad button.r6{background:var(--lamp);color:var(--lamp-ink);border-color:var(--lamp)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;display:grid;gap:4px}
select,input[type=number],input[type=text]{font:inherit;font-size:15px;padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-width:0;max-width:100%}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.xi{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:4px 12px;max-height:280px;overflow:auto;padding:4px}
.xi label:has(input:disabled){opacity:.45}
.xiwarn{margin:0;font-size:13px}
.xi label{display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink);font-weight:400}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;background:var(--chip)}
.pill.pib{color:var(--pib)}.pill.zpx{color:var(--zpx)}
.note{font-size:13px;color:var(--muted)}
.warn{color:var(--bad);font-weight:600;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:20}
.awards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.award{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel);display:grid;gap:2px}
.award .t{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
.award .w{font-family:var(--display);font-size:24px;font-weight:600}
.matchup{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;background:var(--board);border-radius:14px;padding:16px 20px}
.logo{height:56px;background-repeat:no-repeat;background-position:center;background-size:contain}

 PIB:{name:"PROITBRIDGE",short:"PIB",players:["John Gabriel TJ","Gilbert Kidthiyon E","Rajesh Ponnusami","Kevin Louis G","Strephin Manova B","Nithin S","Hariprasath G","Mohammed Wasiq Mohideen","Azeem Ur Rahman","Saleem Ur Rahman","Naveen Kumar J","Nihal Maladakar","Jagadeeshwari D","Swetha K","Rakshitha V R","Sumithra M R","Keerthi M","Abirami S","Mokthi","Kaviyavarsha S","Srivijaya S"]},
 ZPX:{name:"zPROx.AI",short:"ZPX",players:["Mohammed Nasir Ali","Mathiew Henry Nelson","Roshan S","Navinprabu P V","Mohammed Bilal Afrad","Dinesh Kumar S","Madhavan A","Salman N","Faheem Ur Rahman","Pavan Raj","Sahad B S","Suyambulinga Ranjith M","Sruthi Sankar","Diya Bhowmick","Vishnu Priya Velkur","Silpa Suman","Nivedita Krishna Kothuri","Vishalatchi","Nandhiya N","Arivazhagi D"]}
};
const WK={bowled:"Bowled",caught:"Caught",runout:"Run out",stumped:"Stumped",hitwicket:"Hit wicket"};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let canWrite=false, match=null, results=[], loaded=false, liveRev=0;
let ui={extra:null, wk:false, wkKind:"bowled", wkWho:"s", fielder:""};
let writing=false, dirty=false;

/* ---------- scoring engine: everything is derived from the event log ---------- */
function oversStr(b){return Math.floor(b/6)+"."+(b%6)}
function innings(m,i){
  const I=m.innings[i], cfg=m.config, xi=cfg.xi;
  const S={bat:I.bat,bowl:I.bat==="PIB"?"ZPX":"PIB",total:0,wk:0,legal:0,ex:{wd:0,nb:0,b:0,lb:0},
    striker:null,non:null,bowler:null,lastBowler:null,batters:{},order:[],bowlers:{},bowlOrder:[],
    overs:[[]],fow:[],catches:{},freeHit:false,startedAt:I.startedAt||null,done:false,target:null};
  if(i===1){S.target=innings(m,0).total+1}
  const bt=n=>{if(!S.batters[n]){S.batters[n]={r:0,b:0,f4:0,f6:0,out:null};S.order.push(n)}return S.batters[n]};
  const bw=n=>{if(!S.bowlers[n]){S.bowlers[n]={balls:0,r:0,w:0,wd:0,nb:0,maidens:0,cur:0};S.bowlOrder.push(n)}return S.bowlers[n]};
  const swap=()=>{const t=S.striker;S.striker=S.non;S.non=t};
  for(const e of I.events){
    if(e.t==="bat"){const b=bt(e.name);b.out=null;if(e.slot==="s")S.striker=e.name;else S.non=e.name}
    else if(e.t==="bowl"){bw(e.name);S.bowler=e.name}
    else if(e.t==="swap"){swap()}
    else if(e.t==="retire"){const b=bt(e.who);b.out="retired (30)";if(S.striker===e.who)S.striker=null;else if(S.non===e.who)S.non=null}
    else if(e.t==="ball"){
      const r=e.runs|0, x=e.extra||null, B=S.striker?bt(S.striker):null, W=S.bowler?bw(S.bowler):null;
      let label="";
      if(x==="wd"){S.total+=1+r;S.ex.wd+=1+r;if(W){W.r+=1+r;W.wd++;W.cur+=1+r}label=(r?r+1:"")+"wd"}
      else if(x==="nb"){S.total+=1+r;S.ex.nb+=1;if(B){B.r+=r;B.b++;if(r===4)B.f4++;if(r===6)B.f6++}if(W){W.r+=1+r;W.nb++;W.cur+=1+r}label="nb"+(r?"+"+r:"")}
      else if(x==="b"||x==="lb"){S.total+=r;S.ex[x]+=r;if(B)B.b++;label=r+x}
      else{S.total+=r;if(B){B.r+=r;B.b++;if(r===4)B.f4++;if(r===6)B.f6++}if(W){W.r+=r;W.cur+=r}label=String(r===0?"•":r)}
      const legal=x!=="wd"&&x!=="nb";
      if(legal){S.legal++;if(W)W.balls++}
      let cls=x?"bx":(r===4?"b4":r===6?"b6":"");
      if(r%2===1&&S.striker&&S.non)swap();
      if(e.wk){
        const who=e.wk.who==="n"?S.non:S.striker; // after rotation the scorer picks who was out by name
        const outName=e.wk.name||who;
        const ob=bt(outName);
        let how=WK[e.wk.kind]||"Out";
        if(e.wk.kind==="caught")how="c "+(e.wk.fielder||"?")+" b "+(S.bowler||"?");
        else if(e.wk.kind==="bowled")how="b "+(S.bowler||"?");
        else if(e.wk.kind==="stumped")how="st "+(e.wk.fielder||"?")+" b "+(S.bowler||"?");
        else if(e.wk.kind==="runout")how="run out"+(e.wk.fielder?" ("+e.wk.fielder+")":"");
        else if(e.wk.kind==="hitwicket")how="hit wicket b "+(S.bowler||"?");
        else if(e.wk.kind==="net")how="roof/top net b "+(S.bowler||"?");
        ob.out=how;S.wk++;
        if(e.wk.kind!=="runout"&&W)W.w++;
        if((e.wk.kind==="caught")&&e.wk.fielder)S.catches[e.wk.fielder]=(S.catches[e.wk.fielder]||0)+1;
        if(S.striker===outName)S.striker=null;else if(S.non===outName)S.non=null;
        S.fow.push({n:S.wk,score:S.total,name:outName,over:oversStr(S.legal)});
        label=(label==="•"?"":label+" ")+"W";cls="bw";
      }
      S.overs[S.overs.length-1].push({label,cls,fh:S.freeHit});
      S.freeHit = x==="nb" ? true : (x==="wd" ? S.freeHit : false);
      if(legal&&S.legal%6===0){
        if(W){if(W.cur===0)W.maidens++;W.cur=0}
        if(S.striker&&S.non)swap(); else if(!S.striker&&S.non){S.striker=S.non;S.non=null}
        S.lastBowler=S.bowler;S.bowler=null;S.overs.push([]);
      }
    }
    // last man batting: a lone batter always takes strike
    if(S.wk>=xi-1&&!S.striker&&S.non){S.striker=S.non;S.non=null}
  }
  if(S.overs.length>1&&S.overs[S.overs.length-1].length===0&&S.legal%6===0)S.curOver=S.overs[S.overs.length-2];else S.curOver=S.overs[S.overs.length-1];
  const maxBalls=cfg.overs*6;
  S.done = S.legal>=maxBalls || S.wk>=xi || (S.target!==null&&S.total>=S.target) || !!I.closed;
  S.ballsLeft=maxBalls-S.legal;
  return S;
}
function resultText(m){
  if(m.innings.length<2)return null;
  const a=innings(m,0), b=innings(m,1);
  if(!b.done)return null;
  const A=ROSTER[a.bat].name, B=ROSTER[b.bat].name;
  if(b.total>=b.target)return B+" won by "+(m.config.xi-b.wk)+" wicket"+(m.config.xi-b.wk===1?"":"s");
  if(b.total===b.target-1)return "Match tied – play a Super Over (more boundaries wins if still tied)";
  return A+" won by "+(a.total-b.total)+" run"+(a.total-b.total===1?"":"s");
}
function curIdx(m){return m&&m.innings?m.innings.length-1:-1}

/* ---------- persistence (the server stores everything in Postgres) ---------- */
const TOKEN_KEY="cricket-scorer-token";
let token=null;try{token=localStorage.getItem(TOKEN_KEY)}catch(e){}
function setToken(t){token=t;try{t?localStorage.setItem(TOKEN_KEY,t):localStorage.removeItem(TOKEN_KEY)}catch(e){}}
async function api(method,url,body){
  const headers={};if(body!==undefined)headers["Content-Type"]="application/json";if(token)headers.Authorization="Bearer "+token;
  const r=await fetch(url,{method,headers,body:body===undefined?undefined:JSON.stringify(body)});
  const j=await r.json().catch(()=>null);
  if(!r.ok)throw{code:r.status===401?"permission":"http_"+r.status,status:r.status,msg:j&&j.error};
  return j;
}
function commit(msg){
  match.updatedAt=Date.now();
  render();
  if(msg)toast(msg);
  if(writing){dirty=true;return}
  writing=true;
  api("PUT","/api/live",match).then(r=>{liveRev=Math.max(liveRev,r.rev);writing=false;setSync("Live");if(dirty){dirty=false;commit()}})
   .catch(err=>{writing=false;dirty=false;setSync("Not saved");
     if(err&&err.code==="permission"){setToken(null);canWrite=false;render();toast("Your scorer login has expired. Log in again, then re-enter that ball.")}
     else toast("Couldn't save that ball. Check your connection and tap it again.")});
}
function setSync(t){$("#sync").textContent=t}
let tt=null;function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,t.length>40?5000:2200)}

function route(){const h=(location.hash||"").slice(1);return ["live","scorecard","awards","scorer","results"].includes(h)?h:"live"}
function renderTabs(){
  const r=route(), t=[["live","Live"],["scorecard","Scorecard"],["awards","Awards"],["results","Results"]];
  t.push(["scorer",canWrite?"Scorer":"Scorer login"]);

}
function ballsHTML(list){return list.length?list.map(b=>`<span class="ball ${b.cls}" title="${b.fh?"Free hit":""}">${esc(b.label)}</span>`).join(""):'<span class="sub" style="color:inherit;opacity:.7">New over</span>'}
function renderBoard(){
  const el=$("#board");
  if(!loaded){el.innerHTML=`<div class="board"><div class="team">Loading the live score…</div></div>`;return}
  if(!match||!match.innings||!match.innings.length){
    el.innerHTML=`<div class="board"><div class="team">Match not started</div><div class="score num">0/0<small>(0.0)</small></div><div class="meta"><div><span>Format</span><b>10 overs · max 2 per bowler · 11-a-side</b></div></div>${canWrite?'<div><a href="#scorer" style="color:inherit;font-weight:700">Open the scorer to set up the toss and openers →</a></div>':'<div style="opacity:.85">The score appears here ball by ball once the scorer starts the match.</div>'}</div>`;return}
  const i=curIdx(match), S=innings(match,i), cfg=match.config;
  const rr=S.legal?(S.total/(S.legal/6)).toFixed(2):"0.00";
  let extra="";
  if(S.target!==null){const need=S.target-S.total;extra+=`<div><span>Target</span><b class="num">${S.target}</b></div>`;
    if(!S.done)extra+=`<div><span>Need</span><b class="num">${need} off ${S.ballsLeft}</b></div><div><span>Req. rate</span><b class="num">${S.ballsLeft?(need/(S.ballsLeft/6)).toFixed(2):"–"}</b></div>`}
  const res=resultText(match);
  const bat=n=>{if(!n)return'<div><div class="lbl">Batter</div><div class="nm">—</div></div>';const b=S.batters[n];return`<div><div class="lbl">${n===S.striker?"On strike ✱":"Non-striker"}</div><div class="nm">${esc(n)}</div><div class="num">${b.r} (${b.b})</div></div>`};
  const bwl=S.bowler?S.bowlers[S.bowler]:null;
  let elapsed="";if(S.startedAt&&!S.done){const m=Math.floor((Date.now()-S.startedAt)/60000);elapsed=`<div><span>Innings clock</span><b class="num">${m} / 40 min</b></div>`}
  el.innerHTML=`<div class="board">
   ${res?`<div class="banner">${esc(res)}</div>`:""}
   ${S.freeHit&&!S.done?'<div class="banner">FREE HIT</div>':""}
   <div class="row"><div><div class="team"><span class="logo tlogo lg-${S.bat}" role="img" aria-label="${esc(ROSTER[S.bat].name)} logo"></span>${esc(ROSTER[S.bat].name)} · ${i===0?"1st":"2nd"} innings</div>
     <div class="score num">${S.total}/${S.wk}<small>(${oversStr(S.legal)}/${cfg.overs})</small></div></div>
     <div class="meta"><div><span>Run rate</span><b class="num">${rr}</b></div>${extra}${elapsed}</div></div>
   ${i===1?`<div class="sub" style="color:inherit;opacity:.8">${esc(ROSTER[match.innings[0].bat].name)} ${innings(match,0).total}/${innings(match,0).wk} (${oversStr(innings(match,0).legal)})</div>`:""}
   <div class="crease">${bat(S.striker)}${bat(S.non)}<div><div class="lbl">Bowling</div><div class="nm">${S.bowler?esc(S.bowler):"—"}</div>${bwl?`<div class="num">${oversStr(bwl.balls)}-${bwl.r}-${bwl.w} · ${Math.max(0,cfg.maxOvers*6-bwl.balls)/6|0} ov left</div>`:""}</div></div>
   <div><div class="lbl" style="font-size:11px;text-transform:uppercase;letter-spacing:.1em;opacity:.75;margin-bottom:6px">This over</div><div class="chips">${ballsHTML(S.curOver)}</div></div>
  </div>`;
}
function battingTable(S){
  if(!S.order.length)return'<p class="muted">No batters yet.</p>';
  let h=`<div class="tblwrap"><table><thead><tr><th>Batter</th><th></th><th>R</th><th>B</th><th>4s</th><th>6s</th><th>SR</th></tr></thead><tbody>`;
  for(const n of S.order){const b=S.batters[n],live=n===S.striker||n===S.non;
    h+=`<tr class="${live?"live":""}"><td>${esc(n)}${n===S.striker?" ✱":""}</td><td class="how">${b.out?esc(b.out):(live?"not out":"")}</td><td class="num"><b>${b.r}</b></td><td class="num">${b.b}</td><td class="num">${b.f4}</td><td class="num">${b.f6}</td><td class="num">${b.b?(b.r*100/b.b).toFixed(1):"–"}</td></tr>`}
  const x=S.ex;h+=`</tbody></table></div><div class="note">Extras ${x.wd+x.nb+x.b+x.lb} (wd ${x.wd}, nb ${x.nb}, b ${x.b}, lb ${x.lb}) · Total <b>${S.total}/${S.wk}</b> in ${oversStr(S.legal)} overs</div>`;
  if(S.fow.length)h+=`<div class="note">Fall of wickets: ${S.fow.map(f=>`${f.score}-${f.n} (${esc(f.name)}, ${f.over})`).join(", ")}</div>`;
  return h;
}
function bowlingTable(S,cfg){
  if(!S.bowlOrder.length)return'<p class="muted">No bowlers yet.</p>';
  let h=`<div class="tblwrap"><table><thead><tr><th>Bowler</th><th>O</th><th>M</th><th>R</th><th>W</th><th>Wd</th><th>Nb</th><th>Econ</th></tr></thead><tbody>`;
  for(const n of S.bowlOrder){const b=S.bowlers[n];h+=`<tr class="${n===S.bowler?"live":""}"><td>${esc(n)}</td><td class="num">${oversStr(b.balls)}</td><td class="num">${b.maidens}</td><td class="num">${b.r}</td><td class="num"><b>${b.w}</b></td><td class="num">${b.wd}</td><td class="num">${b.nb}</td><td class="num">${b.balls?(b.r/(b.balls/6)).toFixed(2):"–"}</td></tr>`}
  return h+`</tbody></table></div><div class="note">Max ${cfg.maxOvers} overs per bowler.</div>`;
}
function viewScorecard(){
  if(!match||!match.innings||!match.innings.length)return`<div class="card empty">The scorecard fills in once the first ball is bowled.</div>`;
  return match.innings.map((I,i)=>{const S=innings(match,i);return`<section class="card"><h2><span class="pill ${S.bat.toLowerCase()}">${S.bat}</span> ${esc(ROSTER[S.bat].name)} · ${i?"2nd":"1st"} innings · <span class="num">${S.total}/${S.wk} (${oversStr(S.legal)})</span></h2>
   <div class="grid2"><div style="min-width:0">${battingTable(S)}</div><div style="min-width:0"><h3 style="font-size:16px;text-transform:uppercase;margin-bottom:6px">${esc(ROSTER[S.bowl].name)} bowling</h3>${bowlingTable(S,match.config)}</div></div>
   ${S.overs.filter(o=>o.length).length?`<div><div class="note" style="margin-bottom:6px">Over by over</div><div style="display:grid;gap:6px">${S.overs.filter(o=>o.length).map((o,k)=>`<div class="row"><span class="note num" style="width:52px">Over ${k+1}</span><div class="chips">${o.map(b=>`<span class="ball ${b.cls}" style="background:${b.cls?"":"var(--chip)"};${b.cls==="bx"?"background:var(--chip);color:var(--muted)":""}">${esc(b.label)}</span>`).join("")}</div></div>`).join("")}</div></div>`:""}
  </section>`}).join("");
}
function statsOf(m){
  const bat={},bowl={},catches={};
  if(!m||!m.innings)return{bat,bowl,catches};
  m.innings.forEach((_,i)=>{const S=innings(m,i);
    for(const n of S.order){const b=S.batters[n];const k=n+"|"+S.bat;bat[k]=bat[k]||{n,team:S.bat,r:0,b:0};bat[k].r+=b.r;bat[k].b+=b.b}
    for(const n of S.bowlOrder){const b=S.bowlers[n];const k=n+"|"+S.bowl;bowl[k]=bowl[k]||{n,team:S.bowl,w:0,r:0,balls:0};bowl[k].w+=b.w;bowl[k].r+=b.r;bowl[k].balls+=b.balls}
    for(const n in S.catches){const k=n+"|"+S.bowl;catches[k]=catches[k]||{n,team:S.bowl,c:0};catches[k].c+=S.catches[n]}
  });
  return{bat,bowl,catches};
}
function mergeStats(list){
  const out={bat:{},bowl:{},catches:{}};
  for(const s of list){for(const t of ["bat","bowl","catches"])for(const k in s[t]){const v=s[t][k];if(!out[t][k])out[t][k]={...v};else for(const f of ["r","b","w","balls","c"])if(typeof v[f]==="number")out[t][k][f]=(out[t][k][f]||0)+v[f]}}
  return out;
}
function viewAwards(){
  const all=mergeStats([...results.map(r=>r.stats||{bat:{},bowl:{},catches:{}}),statsOf(match)]);
  const bats=Object.values(all.bat).sort((a,b)=>b.r-a.r||((b.b?b.r/b.b:0)-(a.b?a.r/a.b:0)));
  const bowls=Object.values(all.bowl).sort((a,b)=>b.w-a.w||((a.balls?a.r/a.balls:99)-(b.balls?b.r/b.balls:99)));
  const cs=Object.values(all.catches).sort((a,b)=>b.c-a.c);
  const tag=t=>`<span class="pill ${t.toLowerCase()}">${t}</span>`;
  const top=(arr,f)=>arr.length?`<div class="w">${esc(arr[0].n)}</div><div class="note">${tag(arr[0].team)} ${f(arr[0])}</div>`:`<div class="w muted">—</div><div class="note">No data yet</div>`;
  const list=(arr,f,cols)=>arr.length?`<div class="tblwrap"><table><thead><tr><th>Player</th>${cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${arr.slice(0,8).map(x=>`<tr><td>${esc(x.n)} ${tag(x.team)}</td>${f(x)}</tr>`).join("")}</tbody></table></div>`:'<p class="muted">No data yet.</p>';
  return `<div style="display:grid;gap:16px">
   <div class="awards">
    <div class="award"><div class="t">Best Batsman (leader)</div>${top(bats,x=>`${x.r} runs off ${x.b} · SR ${x.b?(x.r*100/x.b).toFixed(1):"–"}`)}</div>
    <div class="award"><div class="t">Best Bowler (leader)</div>${top(bowls,x=>`${x.w} wkts · econ ${x.balls?(x.r/(x.balls/6)).toFixed(2):"–"}`)}</div>
    <div class="award"><div class="t">Most Catches (leader)</div>${top(cs,x=>`${x.c} catch${x.c===1?"":"es"}`)}</div>
   </div>
   <p class="note">Leaders are worked out from the ball-by-ball score across all saved matches and the live match. Best Batsman: most runs (tie-break strike rate). Best Bowler: most wickets (tie-break economy). Best Catcher and Man of the Tournament are decided by the umpires and both captains.</p>
   <div class="grid2">
    <section class="card"><h2>Most runs</h2>${list(bats,x=>`<td class="num"><b>${x.r}</b></td><td class="num">${x.b}</td><td class="num">${x.b?(x.r*100/x.b).toFixed(1):"–"}</td>`,["R","B","SR"])}</section>
    <section class="card"><h2>Most wickets</h2>${list(bowls,x=>`<td class="num"><b>${x.w}</b></td><td class="num">${oversStr(x.balls)}</td><td class="num">${x.r}</td><td class="num">${x.balls?(x.r/(x.balls/6)).toFixed(2):"–"}</td>`,["W","O","R","Econ"])}</section>
   </div></div>`;
}

function viewLive(){
  if(!match||!match.innings||!match.innings.length)return`<div class="card"><h2>Match format</h2><p>10 overs per innings · maximum 2 overs per bowler · 11 players per side, the rest are substitutes · wides and no-balls are 1 run and re-bowled · free hit after a front-foot no-ball · last man may bat alone · LBW not given · Super Over if tied.</p></div>`;
  const S=innings(match,curIdx(match));
  return`<div class="grid2"><section class="card"><h2>Batting · ${S.bat}</h2>${battingTable(S)}</section><section class="card"><h2>Bowling · ${S.bowl}</h2>${bowlingTable(S,match.config)}</section></div>`;
}

function teamList(t){const xi=(match&&match.config&&match.config.squads&&match.config.squads[t])||[];return xi.length?xi:ROSTER[t].players}
function opt(list,sel,ph){return`<option value="">${esc(ph)}</option>`+list.map(n=>`<option ${n===sel?"selected":""}>${esc(n)}</option>`).join("")}
function viewSetup(){
  const sq={PIB:[],ZPX:[]};
  const box=t=>`<div class="card"><h2><span class="pill ${t.toLowerCase()}">${t}</span> ${ROSTER[t].name} playing XI</h2><p class="note">The captain selects 11 players; the rest are substitutes. <span id="cnt${t}" class="num">0</span> selected.</p><p class="warn xiwarn" id="warn${t}" role="status" hidden></p><div class="xi">${ROSTER[t].players.map((n,k)=>`<label><input type="checkbox" id="xi${t}${k}" data-team="${t}" value="${esc(n)}"> ${esc(n)}</label>`).join("")}</div></div>`;
  return`<div style="display:grid;gap:16px"><section class="card"><h2>Match setup</h2>
   <div class="fields">
    <label>Toss won by<select id="toss"><option value="PIB">PROITBRIDGE</option><option value="ZPX">zPROx.AI</option></select></label>
    <label>Elected to<select id="elect"><option value="bat">Bat first</option><option value="bowl">Bowl first</option></select></label>
    <label>Overs per innings<input type="number" id="ovs" min="1" max="20" value="10"></label>
    <label>Max overs per bowler<input type="number" id="mxo" min="1" max="10" value="2"></label>
    <label>Players per side<input type="number" id="xis" min="2" max="15" value="11"></label>
   </div></section>${box("PIB")}${box("ZPX")}
   <div class="row"><button class="primary" id="startMatch">Start match</button><span class="note">You'll pick the opening batters and bowler next.</span></div><div class="row"><button id="logout">Log out</button></div></div>`;
}
function bindSetup(){
  const upd=()=>{const xi=Math.max(2,+$("#xis").value||11);
    for(const t of ["PIB","ZPX"]){
      const boxes=[...document.querySelectorAll(`input[data-team="${t}"]`)], c=boxes.filter(b=>b.checked).length;
      $("#cnt"+t).textContent=c+" / "+xi;
      boxes.forEach(b=>{if(!b.checked)b.disabled=c>=xi});
      const w=$("#warn"+t); w.hidden=c<xi;
      w.textContent=c>xi?`⚠ ${c} selected – untick ${c-xi} to get down to ${xi}.`:`⚠ ${xi} players selected – that's the limit. Untick a player to pick someone else.`;
    }};
  document.querySelectorAll(".xi input").forEach(i=>i.addEventListener("change",upd));
  $("#xis").addEventListener("input",upd); upd();
  $("#startMatch").onclick=()=>{
    const toss=$("#toss").value, elect=$("#elect").value;
    const batFirst=elect==="bat"?toss:(toss==="PIB"?"ZPX":"PIB");
    const xi=Math.max(2,+$("#xis").value||11);
    const squads={PIB:[],ZPX:[]};document.querySelectorAll(".xi input:checked").forEach(i=>squads[i.dataset.team].push(i.value));
    if(squads.PIB.length>xi||squads.ZPX.length>xi){toast("Pick at most "+xi+" players per team.");return}
    match={config:{overs:Math.max(1,+$("#ovs").value||10),maxOvers:Math.max(1,+$("#mxo").value||2),xi,toss,elect,squads},innings:[{bat:batFirst,events:[]}],createdAt:Date.now()};
    commit("Match created");
  };
}
function availBatters(S){return teamList(S.bat).filter(n=>{const b=S.batters[n];return n!==S.striker&&n!==S.non&&(!b||b.out==="retired (30)"||(!b.out&&!b.b&&!b.r))})}
function availBowlers(S,cfg){return teamList(S.bowl).filter(n=>n!==S.lastBowler&&(!S.bowlers[n]||S.bowlers[n].balls<cfg.maxOvers*6))}
function push(ev,msg){const I=match.innings[curIdx(match)];if(!I.startedAt)I.startedAt=Date.now();I.events.push(ev);commit(msg)}
function viewScorer(){
  if(!canWrite)return`<section class="card" style="max-width:420px"><h2>Scorer login</h2><p class="note">Only the match scorer can enter balls. Everyone else can follow the Live tab without logging in.</p>
   <form id="loginF" style="display:grid;gap:10px"><label>Email<input type="text" id="lgE" autocomplete="username" inputmode="email"></label><label>Password<input type="password" id="lgP" autocomplete="current-password" style="font:inherit;padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink)"></label><button class="primary" type="submit">Log in</button></form></section>`;
  if(!match||!match.innings||!match.innings.length)return viewSetup();
  const i=curIdx(match),S=innings(match,i),cfg=match.config;
  const res=resultText(match);
  let h=`<div style="display:grid;gap:16px">`;
  if(S.done){
    if(i===0)h+=`<section class="card"><h2>Innings complete</h2><p>${esc(ROSTER[S.bat].name)} scored <b class="num">${S.total}/${S.wk}</b>. ${esc(ROSTER[S.bowl].name)} need <b class="num">${S.total+1}</b> to win.</p><div class="row"><button class="primary" id="inn2">Start 2nd innings</button><button id="undo">Undo last entry</button></div></section>`;
    else h+=`<section class="card"><h2>Match complete</h2><p><b>${esc(res||"")}</b></p><div class="row"><button class="primary" id="saveRes">Save result &amp; set up next match</button><button id="undo">Undo last entry</button></div><p class="note">Saving adds this match to Results and Awards${driveReady()?", saves the full scorecard as a Google Doc in Google Drive (Google may ask you to sign in)":""}, then clears the board for the next match.</p></section>`;
    return h+dangerZone()+`</div>`;
  }
  // what does the innings need before the next ball?
  const lone=S.wk>=cfg.xi-1;
  if(!S.striker||(!S.non&&!lone)){
    const av=availBatters(S);
    h+=`<section class="card"><h2>${S.order.length?"New batter":"Opening batters"}</h2><div class="fields">
      ${!S.striker?`<label>On strike<select id="selS">${opt(av,"","Choose batter")}</select></label>`:""}
      ${!S.non&&!lone?`<label>Non-striker<select id="selN">${opt(av,"","Choose batter")}</select></label>`:""}
     </div><div class="row"><button class="primary" id="setBat">Send in</button>${S.order.length?'<button id="undo">Undo last entry</button>':""}</div>
     ${lone?'<p class="note">Last man batting: the remaining batter may bat alone.</p>':""}</section>`;
    return h+`</div>`;
  }
  if(!S.bowler){
    const av=availBowlers(S,cfg);
    h+=`<section class="card"><h2>${S.legal?"Next over":"Opening bowler"} · over ${Math.floor(S.legal/6)+1}</h2>
      <label>Bowler<select id="selB">${opt(av,"","Choose bowler")}</select></label>
      <p class="note">${S.lastBowler?esc(S.lastBowler)+" bowled the last over and can't bowl two in a row. ":""}Bowlers who have used their ${cfg.maxOvers} overs are hidden.</p>
      <div class="row"><button class="primary" id="setBowl">Start over</button>${S.legal?'<button id="undo">Undo last entry</button>':""}</div></section>`;
    return h+`</div>`;
  }
  const ex=k=>`<button class="tog ${ui.extra===k?"on":""}" data-ex="${k}">${{wd:"Wide",nb:"No ball",b:"Bye",lb:"Leg bye"}[k]}</button>`;
  const runs=[0,1,2,3,4,6];
  h+=`<section class="card"><h2>Next ball · ${oversStr(S.legal)} · ${esc(S.bowler)} to ${esc(S.striker)}</h2>
   ${S.freeHit?'<div class="banner">FREE HIT – only run out allowed</div>':""}
   <div class="row">${ex("wd")}${ex("nb")}${ex("b")}${ex("lb")}<button class="tog ${ui.wk?"on":""}" id="wkT" style="${ui.wk?"":"color:var(--bad);border-color:var(--bad)"}">Wicket</button></div>`;
  if(ui.wk){
    const fl=teamList(S.bowl);
    h+=`<div class="fields">
      <label>How out<select id="wkKind">${Object.entries(WK).map(([k,v])=>`<option value="${k}" ${ui.wkKind===k?"selected":""}>${v}</option>`).join("")}</select></label>
      <label>Batter out<select id="wkWho"><option value="s" ${ui.wkWho==="s"?"selected":""}>${esc(S.striker)} (striker)</option>${S.non?`<option value="n" ${ui.wkWho==="n"?"selected":""}>${esc(S.non)} (non-striker)</option>`:""}</select></label>
      ${["caught","runout","stumped"].includes(ui.wkKind)?`<label>${ui.wkKind==="caught"?"Caught by":ui.wkKind==="stumped"?"Keeper":"Fielder"}<select id="wkF">${opt(fl,ui.fielder,"Choose fielder")}</select></label>`:""}
     </div><p class="note">Tap the runs completed on this ball (usually 0) to record the wicket.${S.freeHit?' <span class="warn">Free hit: only a run out counts.</span>':""}</p>`;
  }
  h+=`<div class="pad">${runs.map(r=>`<button class="${r===4?"r4":r===6?"r6":""}" data-run="${r}">${r}</button>`).join("")}</div>
   <p class="note">${ui.extra==="wd"?"Wide: 1 run plus any runs taken; ball is re-bowled.":ui.extra==="nb"?"No ball: 1 run plus runs off the bat; ball is re-bowled and the next ball is a free hit.":ui.extra?"Runs tapped go to extras.":"Tap the runs off the bat."}</p>
   <div class="row"><button id="undo">Undo last entry</button><button id="swapS">Swap strike</button></div>
  </section>`;
  return h+dangerZone()+`</div>`;
}
function dangerZone(){return`<details class="card"><summary style="cursor:pointer;font-weight:600">More options</summary><div class="row" style="margin-top:8px"><button id="logout">Log out</button><button id="endInn">End this innings now</button><button class="danger" id="reset">Clear match (no save)</button></div><p class="note" id="resetNote" hidden>Tap "Clear match" again to confirm. This deletes the live match without saving it.</p></details>`}
function bindScorer(){
  const lf=$("#loginF");
  if(lf){lf.onsubmit=e=>{e.preventDefault();api("POST","/api/login",{email:$("#lgE").value.trim(),password:$("#lgP").value}).then(r=>{setToken(r.token);canWrite=true;render();toast("Logged in")}).catch(err=>toast(err&&err.status===429?"Too many attempts. Wait a few minutes and try again.":err&&err.status===401?"Wrong email or password.":"Couldn't reach the server. Check your connection."))};return}
  const on=(id,f)=>{const el=$("#"+id);if(el)el.onclick=f};
  const lo=$("#logout");if(lo)lo.onclick=()=>{setToken(null);canWrite=false;location.hash="#live";render();toast("Logged out")};
  if(!match||!match.innings||!match.innings.length){bindSetup();return}
  const i=curIdx(match),S=innings(match,i);
  on("undo",()=>{const I=match.innings[i];if(I.events.length){I.events.pop();commit("Undone")}else if(i>0){match.innings.pop();commit("Undone")}});
  on("inn2",()=>{match.innings.push({bat:S.bowl,events:[]});commit("2nd innings")});
  on("saveRes",async()=>{
    const tokP=driveReady()?getToken():null;
    const a=innings(match,0),b=innings(match,1);
    const r={result:resultText(match),lines:[`${ROSTER[a.bat].name} ${a.total}/${a.wk} (${oversStr(a.legal)})`,`${ROSTER[b.bat].name} ${b.total}/${b.wk} (${oversStr(b.legal)})`],stats:statsOf(match),match:JSON.parse(JSON.stringify(match)),savedAt:Date.now()};
    const n=results.length+1;let id=null;
    try{id=(await api("POST","/api/results",r)).id;match={innings:[]};commit("Result saved")}catch(e){toast("Couldn't save the result. Try again.");return}
    saveToDrive(id,r,n,tokP);
  });
  on("setBat",()=>{const s=$("#selS")?.value,n=$("#selN")?.value;
    if($("#selS")&&!s||$("#selN")&&!n){toast("Choose the batter"+($("#selS")&&$("#selN")?"s":""));return}
    if(s&&n&&s===n){toast("Pick two different batters");return}
    const I=match.innings[i];if(s)I.events.push({t:"bat",slot:"s",name:s});if(n)I.events.push({t:"bat",slot:"n",name:n});commit()});
  on("setBowl",()=>{const b=$("#selB").value;if(!b){toast("Choose a bowler");return}push({t:"bowl",name:b})});
  document.querySelectorAll("[data-ex]").forEach(b=>b.onclick=()=>{ui.extra=ui.extra===b.dataset.ex?null:b.dataset.ex;render()});
  on("wkT",()=>{ui.wk=!ui.wk;render()});
  const k=$("#wkKind");if(k)k.onchange=()=>{ui.wkKind=k.value;render()};
  const w=$("#wkWho");if(w)w.onchange=()=>{ui.wkWho=w.value};
  const f=$("#wkF");if(f)f.onchange=()=>{ui.fielder=f.value};
  document.querySelectorAll("[data-run]").forEach(b=>b.onclick=()=>{
    const r=+b.dataset.run, ev={t:"ball",runs:r};
    if(ui.extra)ev.extra=ui.extra;
    if(ui.wk){
      if(S.freeHit&&ui.wkKind!=="runout"){toast("Free hit: only a run out counts.");return}
      if(["caught","stumped"].includes(ui.wkKind)&&!ui.fielder){toast("Choose the fielder");return}
      ev.wk={kind:ui.wkKind,who:ui.wkWho,name:ui.wkWho==="n"?S.non:S.striker};if(ui.fielder&&["caught","runout","stumped"].includes(ui.wkKind))ev.wk.fielder=ui.fielder;
    }
    ui={extra:null,wk:false,wkKind:"bowled",wkWho:"s",fielder:""};
    push(ev, ev.wk?"Wicket":(ev.extra?{wd:"Wide",nb:"No ball",b:"Bye",lb:"Leg bye"}[ev.extra]:r+" run"+(r===1?"":"s")));
  });
  on("swapS",()=>push({t:"swap"},"Strike swapped"));
  on("endInn",()=>{match.innings[i].closed=true;commit("Innings ended")});
  let armed=false;on("reset",()=>{if(!armed){armed=true;$("#resetNote").hidden=false;return}match={innings:[]};commit("Match cleared")});
}
/* ---------- Google Drive scorecard ---------- */
let DRIVE_FOLDER=null; // created on first save, remembered in the database (config/drive)
function scorecardHTML(m,r,n){
  const cfg=m.config||{};const sec=[];
  m.innings.forEach((_,i)=>{const S=innings(m,i);
    const bat=S.order.map(nm=>{const b=S.batters[nm];return`<tr><td>${esc(nm)}</td><td>${esc(b.out||"not out")}</td><td>${b.r}</td><td>${b.b}</td><td>${b.f4}</td><td>${b.f6}</td><td>${b.b?(b.r*100/b.b).toFixed(1):"-"}</td></tr>`}).join("");
    const bowl=S.bowlOrder.map(nm=>{const b=S.bowlers[nm];return`<tr><td>${esc(nm)}</td><td>${oversStr(b.balls)}</td><td>${b.maidens}</td><td>${b.r}</td><td>${b.w}</td><td>${b.wd}</td><td>${b.nb}</td><td>${b.balls?(b.r/(b.balls/6)).toFixed(2):"-"}</td></tr>`}).join("");
    const x=S.ex;
    sec.push(`<h2>${esc(ROSTER[S.bat].name)} – ${i?"2nd":"1st"} innings: ${S.total}/${S.wk} (${oversStr(S.legal)} overs)</h2>
<table border="1" cellpadding="4" style="border-collapse:collapse"><tr><th>Batter</th><th>How out</th><th>R</th><th>B</th><th>4s</th><th>6s</th><th>SR</th></tr>${bat}</table>
<p>Extras: ${x.wd+x.nb+x.b+x.lb} (wd ${x.wd}, nb ${x.nb}, b ${x.b}, lb ${x.lb})</p>
${S.fow.length?`<p>Fall of wickets: ${S.fow.map(f=>`${f.score}-${f.n} (${esc(f.name)}, ${f.over})`).join(", ")}</p>`:""}
<h3>${esc(ROSTER[S.bowl].name)} bowling</h3>
<table border="1" cellpadding="4" style="border-collapse:collapse"><tr><th>Bowler</th><th>O</th><th>M</th><th>R</th><th>W</th><th>Wd</th><th>Nb</th><th>Econ</th></tr>${bowl}</table>`)});
  const st=r.stats||statsOf(m);
  const tb=Object.values(st.bat||{}).sort((a,b)=>b.r-a.r)[0], tw=Object.values(st.bowl||{}).sort((a,b)=>b.w-a.w||a.r-b.r)[0], tc=Object.values(st.catches||{}).sort((a,b)=>b.c-a.c)[0];
  return`<html><body><h1>PROITBRIDGE vs zPROx.AI – Cricket Match ${n}</h1>
<p>${new Date(r.savedAt||Date.now()).toLocaleString("en-IN",{dateStyle:"full",timeStyle:"short"})} · ${cfg.overs||10} overs per side · max ${cfg.maxOvers||2} overs per bowler</p>
<p>Toss: ${esc(ROSTER[cfg.toss]?.name||"-")}, elected to ${cfg.elect==="bowl"?"bowl":"bat"} first</p>
<h2>Result: ${esc(r.result||"")}</h2><p>${(r.lines||[]).map(esc).join("<br>")}</p>
${sec.join("\n")}
<h2>Top performers</h2><ul>
<li>Top scorer: ${tb?`${esc(tb.n)} (${tb.team}) – ${tb.r} off ${tb.b}`:"-"}</li>
<li>Best bowling: ${tw?`${esc(tw.n)} (${tw.team}) – ${tw.w}/${tw.r}`:"-"}</li>
<li>Most catches: ${tc?`${esc(tc.n)} (${tc.team}) – ${tc.c}`:"-"}</li></ul>
<p><i>Saved automatically from the PIB vs ZPX live score tracker.</i></p></body></html>`;
}
function driveReady(){return !!(window.GOOGLE_CLIENT_ID&&!String(window.GOOGLE_CLIENT_ID).startsWith("PASTE"))}
let gTok=null,gExp=0;
function getToken(){ // call directly inside a click so the Google pop-up isn't blocked
  const p=new Promise((res,rej)=>{
    if(gTok&&Date.now()<gExp)return res(gTok);
    if(!(window.google&&google.accounts&&google.accounts.oauth2))return rej({code:"gis_missing"});
    const tc=google.accounts.oauth2.initTokenClient({client_id:window.GOOGLE_CLIENT_ID,scope:"https://www.googleapis.com/auth/drive.file",
      callback:t=>{if(t.error)return rej({code:t.error});gTok=t.access_token;gExp=Date.now()+((t.expires_in||3600)-60)*1000;res(gTok)},
      error_callback:e=>rej({code:(e&&e.type)||"popup"})});
    tc.requestAccessToken();
  });
  p.catch(()=>{});return p;
}
async function gapi(url,tok,opt){const r=await fetch(url,{...opt,headers:{Authorization:"Bearer "+tok,...(opt&&opt.headers||{})}});if(!r.ok)throw{code:"http_"+r.status};return r.json()}
async function ensureFolder(tok){
  if(DRIVE_FOLDER)return DRIVE_FOLDER;
  const d=await api("GET","/api/config/drive");
  if(d&&d.folderId){DRIVE_FOLDER=d.folderId;return DRIVE_FOLDER}
  const f=await gapi("https://www.googleapis.com/drive/v3/files?fields=id",tok,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:window.DRIVE_FOLDER_NAME||"PIB vs ZPX Cricket – Scorecards",mimeType:"application/vnd.google-apps.folder"})});
  DRIVE_FOLDER=f.id;await api("PUT","/api/config/drive",{folderId:f.id,url:"https://drive.google.com/drive/folders/"+f.id});return f.id;
}
async function saveToDrive(id,r,n,tokP){
  if(!driveReady()||!tokP){return false}
  try{
    const tok=await tokP;
    const folder=await ensureFolder(tok);
    const d=new Date(r.savedAt||Date.now());
    const title=`PIB vs ZPX Cricket – Match ${n} – ${d.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"})}`;
    const B="sc"+Math.random().toString(36).slice(2);
    const body=`--${B}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({name:title,mimeType:"application/vnd.google-apps.document",parents:[folder]})}\r\n--${B}\r\nContent-Type: text/html; charset=UTF-8\r\n\r\n${scorecardHTML(r.match||match,r,n)}\r\n--${B}--`;
    const f=await gapi("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,webViewLink",tok,{method:"POST",headers:{"Content-Type":"multipart/related; boundary="+B},body});
    if(id)await api("PATCH","/api/results/"+encodeURIComponent(id),{drive:{id:f.id,url:f.webViewLink||("https://docs.google.com/document/d/"+f.id+"/edit"),savedAt:Date.now()}}).catch(()=>{});
    toast("Scorecard saved to Google Drive");return true;
  }catch(e){
    const c=e&&e.code;
    toast(c==="popup_closed"||c==="access_denied"||c==="popup_failed_to_open"?"Google sign-in was cancelled. Use Results → Save scorecard to Google Drive to try again."
      :c==="gis_missing"?"Google sign-in didn't load. Check your connection, then try again from Results."
      :c==="http_401"||c==="http_403"?"Google Drive refused the save. Sign in with the organiser's Google account and try again from Results."
      :"The Drive save didn't confirm. Check the scorecards folder before trying again.");
    return false;
  }
}
function render(){
  renderTabs();renderBoard();
  const r=route(),v=$("#view");
  if(!loaded){v.innerHTML="";return}
  v.innerHTML=r==="scorecard"?viewScorecard():r==="awards"?viewAwards():r==="results"?viewResults():r==="scorer"?viewScorer():viewLive();
  if(r==="scorer")bindScorer();
  if(r==="results")document.querySelectorAll("[data-drive]").forEach(b=>b.onclick=()=>{const x=results.find(z=>z._id===b.dataset.drive);if(!x)return;b.disabled=true;b.textContent="Saving…";saveToDrive(x._id,x,+b.dataset.n,driveReady()?getToken():null).finally(()=>render())});
}
window.addEventListener("hashchange",render);
setInterval(()=>{if(match&&match.innings&&match.innings.length&&route()!=="scorer")renderBoard()},30000);
render();

/* ---------- live updates: the server pushes every change over Server-Sent Events ---------- */
(function(){
  if(token)api("GET","/api/me").then(()=>{canWrite=true;render()}).catch(e=>{if(e&&e.code==="permission")setToken(null)});
  // rev only goes up; skip anything older than what we already show, and our own writes while they're in flight
  const applyLive=s=>{if(!s||writing||dirty||(loaded&&s.rev<=liveRev))return false;liveRev=s.rev;match=s.data||null;return true};
  const applyDrive=d=>{if(d&&d.folderId)DRIVE_FOLDER=d.folderId};
  const es=new EventSource("/api/stream");
  es.addEventListener("state",e=>{const s=JSON.parse(e.data);applyLive(s.live);results=s.results||[];applyDrive(s.drive);loaded=true;setSync("Live");render()});
  es.addEventListener("live",e=>{if(applyLive(JSON.parse(e.data)))render()});
  es.addEventListener("results",e=>{results=JSON.parse(e.data)||[];render()});
  es.addEventListener("drive",e=>{applyDrive(JSON.parse(e.data));if(route()==="results")render()});
  es.onerror=()=>setSync("Reconnecting…"); // EventSource retries by itself
})();
})();
</script>
